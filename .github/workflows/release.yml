name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - Cargo.toml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
            tag="v${version}"
          fi
          git rev-parse --verify "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check whether release exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out tagged source
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --detach "$TAG"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.existing.outputs.skip != 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy

      - name: Validate tagged source
        if: steps.existing.outputs.skip != 'true'
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Build macOS binaries
        if: steps.existing.outputs.skip != 'true'
        run: |
          cargo build --release --target aarch64-apple-darwin --locked
          cargo build --release --target x86_64-apple-darwin --locked

      - name: Package release assets
        if: steps.existing.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          mkdir -p dist/aarch64-apple-darwin dist/x86_64-apple-darwin
          cp target/aarch64-apple-darwin/release/diskscry README.md THIRD_PARTY_LICENSES.md dist/aarch64-apple-darwin/
          cp target/x86_64-apple-darwin/release/diskscry README.md THIRD_PARTY_LICENSES.md dist/x86_64-apple-darwin/
          tar -czf "dist/diskscry-v${version}-aarch64-apple-darwin.tar.gz" -C dist/aarch64-apple-darwin diskscry README.md THIRD_PARTY_LICENSES.md
          tar -czf "dist/diskscry-v${version}-x86_64-apple-darwin.tar.gz" -C dist/x86_64-apple-darwin diskscry README.md THIRD_PARTY_LICENSES.md
          cd dist
          shasum -a 256 "diskscry-v${version}-aarch64-apple-darwin.tar.gz" "diskscry-v${version}-x86_64-apple-darwin.tar.gz" > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Publish GitHub release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NOTES: |
            First macOS developer preview of DiskScry, a read-only Rust CLI/TUI for physical-disk and SMART health inspection.

            Highlights:
            - Native macOS Disk Arbitration and IOKit discovery
            - ATA and NVMe SMART parsing without smartmontools
            - English and Simplified Chinese CLI/TUI
            - CrystalDiskInfo-style readable SMART metrics with exact raw evidence
            - Explicit SMART unavailable and failed states for external disks

            The attached Apple Silicon and Intel binaries are unsigned and not notarized.
        run: |
          gh release create "$TAG" \
            dist/diskscry-*.tar.gz \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DiskScry $TAG" \
            --notes "$RELEASE_NOTES"
