[package]
name = "diskscry"
version = "0.1.0"
edition = "2024"
description = "Read-only terminal disk health monitor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZHOUSJ6/DiskScry"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8"
libc = "0.2"
objc2-io-kit = "0.3.2"

[dev-dependencies]
insta = "1.48.0"

[profile.release]
lto = "thin"
strip = true
